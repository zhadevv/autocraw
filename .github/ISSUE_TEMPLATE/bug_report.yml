name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: autocraw version
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.12.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code
      description: The exact command line or a minimal code sample. Remove API keys and private URLs.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with -v
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Fetch mode
      options:
        - auto
        - http
        - browser
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
